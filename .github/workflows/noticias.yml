name: Noticias automáticas

on:
  schedule:
    - cron: "17 * * * *"   # cada hora, al minuto 17
  workflow_dispatch:         # permite correrlo a mano desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Traer titulares
        run: python3 scripts/noticias.py

      - name: Guardar si hay cambios
        run: |
          git config user.name "Renacer noticias"
          git config user.email "actions@users.noreply.github.com"
          git add datos/noticias-auto.json
          if git diff --cached --quiet; then
            echo "Sin noticias nuevas"
          else
            git commit -m "Noticias automáticas $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
